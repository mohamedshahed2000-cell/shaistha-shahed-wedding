<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaistha & Shahed</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#061224;
font-family:Georgia,serif;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url('./8e68da58-60d0-438f-b13c-7505d463b4d4.jpeg');
background-size:cover;
background-position:center;
}

h1{
font-size:3rem;
color:#d4af37;
}

.subtitle{
margin-top:10px;
font-size:1.1rem;
letter-spacing:3px;
}

.date{
margin-top:25px;
padding:12px 24px;
border:1px solid #d4af37;
border-radius:50px;
}

.section{
padding:60px 25px;
text-align:center;
}

.card{
background:#0b1f39;
padding:25px;
border-radius:20px;
margin-top:20px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 24px;
background:#d4af37;
color:#000;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}
</style>
</head>

<body>

<section class="hero">
<h1>Shaistha ❤️ Shahed</h1>
<p class="subtitle">THE BEGINNING OF FOREVER</p>

<div class="date">
26 July 2026
</div>
</section>

<section class="section">
<h2 style="color:#d4af37;">Nikah Ceremony</h2>

<div class="card">
<p>After Asr Prayer</p>
<p>4:00 PM – 5:00 PM</p>
</div>

<div class="card">
<p>Reception</p>
<p>6:30 PM Onwards</p>
</div>

<a class="btn" href="https://maps.app.goo.gl/Hp3LteYNjZCH36yz6">
View Venue
</a>

</section>

</body>
</html>
